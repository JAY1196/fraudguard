server:
  port: ${APP_PORT:8082}

spring:
  application:
    name: fraudguard
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true

fraudguard:
  thresholds:
    review: 40
    block: 70
  validation:
    max-future-skew-seconds: 300
  rules:
    high-amount:
      enabled: true
      threshold-paise: 5000000
      weight: 50
      reason-code: HIGH_AMOUNT
    unusual-hours:
      enabled: true
      start-hour: 23
      end-hour: 5
      threshold-paise: 2000000
      weight: 40
      reason-code: UNUSUAL_HOURS_HIGH_AMOUNT
      time-zone: Asia/Kolkata
    velocity:
      enabled: true
      window-seconds: 300
      max-transactions-in-window: 5
      weight: 40
      reason-code: VELOCITY_EXCEEDED
      ttl-seconds: 600
